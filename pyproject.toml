[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-rag"
version = "0.1.0"
description = "Ask why something failed; answered from runbooks with citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "qdrant-client>=1.9,<1.10",  # must match the v1.9 server in docker-compose.yml
  "pydantic-settings>=2.2",
  "sentence-transformers>=2.7",
  "transformers>=4.40",
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
  "openai>=1.30",
]

[project.scripts]
ask = "src.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.4.0",
]
eval = [
    "langchain-community<0.4",  # ragas 0.4 still imports a module removed in langchain-community 0.4
    "ragas>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
